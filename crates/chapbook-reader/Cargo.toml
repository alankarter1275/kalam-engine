[package]
name = "chapbook-reader"
description = "Shared reading-session state for chapbook viewer shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Everything on, so a shell that just depends on chapbook-reader reads
# every format chapbook supports. A device build turns off what its
# hardware will never open: each of these is a whole format stack, not a
# code path. Dropping all three takes the dependency graph from 239
# third-party crates to 196, and takes the entire TLS stack (rustls, ring,
# webpki) and the entire PDF stack (hayro plus its JBIG2, JPEG2000, CCITT
# and PostScript decoders) out of the build.
default = ["library", "cbz", "pdf", "opds", "ureq", "svg", "mathml"]
# The local bookshelf: imported books, reading positions, annotations,
# saved catalogs. Off, the session reads but remembers nothing — every book
# opens at the beginning and marks cannot be stored — and rusqlite and
# bundled SQLite leave the build with it. That is the profile a browser
# forces, since there is no filesystem for a database to live in, and the
# one a stripped e-ink build wants.
library = ["dep:chapbook-library"]
# Local CBZ comic archives.
cbz = ["dep:chapbook-cbz", "_comic", "_image-book"]
# PDF, rasterized by hayro, with its extracted text layer.
pdf = ["dep:chapbook-pdf", "_image-book"]
# OPDS catalogs and OPDS-PSE streamed comics. This is the only feature
# that brings in networking.
# Requires `library`: a page stream caches to disk, and the directory it
# caches into is the library's.
opds = ["dep:chapbook-opds", "library", "_comic", "_image-book"]
# The bundled desktop transport, and the only thing that pulls in a TLS
# stack. `opds` without this is the configuration a host with its own
# networking wants — iOS `URLSession`, Android `WorkManager`, WASM `fetch` —
# and it keeps every byte of OPDS parsing while dropping ureq, rustls and
# ring. Such a build must supply `SessionConfig::with_transport`; there is
# no bundled fallback left for it to fall back to, and `Session::open_with`
# says so rather than failing to compile.
ureq = ["chapbook-opds/ureq"]
# SVG images in EPUB chapters (`<img src="*.svg">`, inline `<svg>`),
# rasterized by resvg. A rendering capability, not a format: off, SVGs
# degrade silently (missing image, flattened text), which is why it is a
# named choice rather than always-on.
svg = ["chapbook-layout/svg"]
# Native MathML Core rendering (formulary + an embedded STIX Two Math,
# ~820 KB of font in the binary). Off, `<math>` takes the EPUB
# altimg/alttext fallback; locator text is identical either way.
mathml = ["chapbook-layout/mathml"]

# Internal, set by the features above; do not enable directly. They name
# the two capabilities the session gains, so the `cfg`s below say what they
# mean instead of re-deriving it from a list of formats that will grow.
#
# `_comic`: some format produces an image-per-page publication as a trait
# object. `_image-book`: some format pages units in off the loader thread,
# which EPUB never does — its chapters are local zip reads plus a cascade
# that has to run on the session thread anyway.
_comic = []
_image-book = []

[dependencies]
chapbook-core = { workspace = true }
log = { workspace = true }
chapbook-epub = { workspace = true }
chapbook-cbz = { workspace = true, optional = true }
chapbook-pdf = { workspace = true, optional = true }
chapbook-opds = { workspace = true, optional = true, default-features = false }
# Defaults off (via the workspace entry) so the `svg`/`mathml`
# passthroughs above are real choices: with layout's defaults inherited
# here, no consumer could ever turn them off.
chapbook-layout = { workspace = true }
chapbook-paint = { workspace = true }
chapbook-library = { workspace = true, optional = true }
chapbook-render-tinyskia = { workspace = true }
cosmic-text = { workspace = true }
unicode-segmentation = { workspace = true }
image = { workspace = true }
