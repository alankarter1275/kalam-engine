[package]
name = "chapbook-annotations"
description = "Web Annotation Protocol sync for chapbook's highlights, notes and bookmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chapbook-core = { workspace = true }
chapbook-library = { workspace = true }
opds-client = { workspace = true, features = ["write"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[features]
# Forwards opds-client's bundled desktop transport, as chapbook-opds does.
default = ["ureq"]
ureq = ["opds-client/ureq"]
