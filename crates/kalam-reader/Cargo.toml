[package]
name = "kalam-reader"
description = "The GTK4 reading widget Kalam embeds: kalam-engine wrapped for one app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Kalam's own code, not inherited from Chapbook. The Chapbook crates it
# wraps stay MIT OR Apache-2.0; see README.md at the repository root.
license = "GPL-3.0-or-later"
repository = "https://github.com/alankarter1275/kalam-engine"

[dependencies]
chapbook-core = { workspace = true }
# `svg` and `mathml` because books carry both and Kalam keeps MathML.
chapbook-reader = { workspace = true, features = ["svg", "mathml"] }
# Same gtk4-rs line as chapbook-viewer-gtk, and for the same reason: one
# copy of gtk4-sys in the workspace (it `links = "gtk-4"`, so there can only
# be one). v4_16 is inherited from that viewer; Kalam itself runs on GTK
# 4.16+ desktops already.
gtk4 = { version = "0.11", features = ["v4_16"] }
# The background-load wakeup, exactly as chapbook-viewer-gtk uses it.
futures-channel = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
