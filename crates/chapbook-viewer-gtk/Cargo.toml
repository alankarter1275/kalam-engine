[package]
name = "chapbook-viewer-gtk"
description = "GTK4 reference viewer for chapbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Linux only. gtk4-sys probes for gtk4.pc through pkg-config, so every
# dependency here is unbuildable on a stock macOS or Windows box — including
# the chapbook crates, which nothing outside `src/linux.rs` uses. Off this
# target the crate is a stub `main` and no dependencies at all.
[target.'cfg(target_os = "linux")'.dependencies]
chapbook-core = { workspace = true }
chapbook-reader = { workspace = true, features = ["cbz", "pdf", "opds", "svg", "mathml"] }
chapbook-render-tinyskia = { workspace = true }
gtk4 = { version = "0.11", features = ["v4_10"] }
