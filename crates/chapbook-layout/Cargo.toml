[package]
name = "chapbook-layout"
description = "Arena DOM, stylo cascade driver, and pagination-first layout for chapbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chapbook-core = { workspace = true }
chapbook-paint = { workspace = true }
style = { workspace = true }
style_traits = { workspace = true }
style_dom = { workspace = true }
style_config = { workspace = true }
selectors = { workspace = true }
cssparser = { workspace = true }
cosmic-text = { workspace = true }
unicode-script = { workspace = true }
sys-locale = { workspace = true }
hyphenation = { workspace = true }
html5ever = { workspace = true }
markup5ever = { workspace = true }
slotmap = { workspace = true }
euclid = { workspace = true }
app_units = { workspace = true }
url = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
chapbook-epub = { workspace = true }

[features]
default = ["svg", "mathml"]
# Strict well-formed-XML parsing of content documents via xml5ever on the same
# tree builder; the default html5ever path is lenient about real-world EPUBs.
strict-xml = ["dep:xml5ever"]
# SVG images (`<img src="*.svg">` and inline `<svg>`), rasterized into the
# ImageStore by resvg. Off, SVGs degrade exactly as before the feature
# existed: undecodable `<img>` vanishes, inline `<svg>` flattens to its text.
svg = ["dep:resvg", "dep:fontdb"]
# Native MathML Core rendering via formulary, with STIX Two Math (OFL 1.1,
# `assets/`) embedded as the math font of last resort. Off, `<math>` takes
# the EPUB altimg/alttext fallback path (`dom::math_fallback`) unchanged.
# ~820 KB of font in the binary — the stripped e-ink profile's reason to
# say no.
mathml = ["dep:formulary", "dep:ttf-parser"]

[dependencies.xml5ever]
workspace = true
optional = true

[dependencies.resvg]
workspace = true
optional = true

# Only to switch fontdb 0.24's `fs` on for the usvg build; see the
# workspace entry. Nothing imports `fontdb` directly.
[dependencies.fontdb]
workspace = true
optional = true

[dependencies.formulary]
workspace = true
optional = true

[dependencies.ttf-parser]
workspace = true
optional = true
