[package]
name = "opds-client"
description = "OPDS 1.2 (Atom) and 2.0 (JSON) catalog client with a bring-your-own-HTTP transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }

[features]
# The bundled desktop transport. Turning it off drops ureq, rustls and the
# webpki root store; the caller supplies its own `HttpClient` and everything
# else in the crate is unchanged. See src/http.rs for why that seam exists.
default = ["ureq"]
ureq = ["dep:ureq"]
# OPDS Progression 1.0 position sync. Off by default because the spec is an
# unreleased draft (drafts.opds.io, absent from specs.opds.io) whose wire
# format can still change — not because it costs dependencies, since it adds
# none. Turning it on is a caller accepting that surface may move; it also
# adds `HttpClient::put`, which has a refusing default so existing
# transports keep compiling. See src/progression.rs and INTEROP.md §6.
progression = []
