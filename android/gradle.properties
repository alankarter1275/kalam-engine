org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# This machine has a JRE at /usr/lib/jvm and no JDK, so Gradle's toolchain
# auto-detection picks an installation with no compiler in it and fails
# before compiling anything. Use the JVM Gradle is already running on —
# point JAVA_HOME at a JDK (Android Studio ships one at
# <studio>/jbr) and nothing else needs configuring.
org.gradle.java.installations.auto-detect=false
