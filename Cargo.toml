[workspace]
resolver = "2"
members = [
    "crates/chapbook-core",
    "crates/chapbook-epub",
    "crates/chapbook-dom",
    "crates/chapbook-style",
    "crates/chapbook-layout",
    "crates/chapbook-paint",
    "crates/chapbook-render-tinyskia",
    "crates/chapbook-render-vello",
    "crates/chapbook-panel-fbdev",
    "crates/chapbook-opds",
    "crates/chapbook-cbz",
    "crates/chapbook-pdf",
    "crates/chapbook-library",
    "crates/chapbook-reader",
    "crates/chapbook-viewer",
    "crates/chapbook-viewer-gtk",
    "tools/chapbook-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92" # floor: hayro (stylo needs 1.89)
license = "MIT OR Apache-2.0"
authors = ["Jeffrey T. Peckham <abic@ophymx.com>"]

[workspace.dependencies]
# Internal crates
chapbook-core = { path = "crates/chapbook-core" }
chapbook-epub = { path = "crates/chapbook-epub" }
chapbook-dom = { path = "crates/chapbook-dom" }
chapbook-style = { path = "crates/chapbook-style" }
chapbook-layout = { path = "crates/chapbook-layout" }
chapbook-paint = { path = "crates/chapbook-paint" }
chapbook-render-tinyskia = { path = "crates/chapbook-render-tinyskia" }
chapbook-render-vello = { path = "crates/chapbook-render-vello" }
chapbook-panel-fbdev = { path = "crates/chapbook-panel-fbdev" }
chapbook-opds = { path = "crates/chapbook-opds" }
chapbook-cbz = { path = "crates/chapbook-cbz" }
chapbook-pdf = { path = "crates/chapbook-pdf" }
chapbook-library = { path = "crates/chapbook-library" }
chapbook-reader = { path = "crates/chapbook-reader" }

# Stylo lockstep set — these release together and break together; pin exact
# versions and upgrade all of them in one deliberate pass (use Blitz's diff
# as the migration guide).
style = { version = "=0.20.0", package = "stylo" }
style_traits = { version = "=0.20.0", package = "stylo_traits" }
style_atoms = { version = "=0.20.0", package = "stylo_atoms" }
style_config = { version = "=0.20.0", package = "stylo_static_prefs" }
style_dom = { version = "=0.20.0", package = "stylo_dom" }
selectors = "=0.40.0"
cssparser = "=0.37.0"
# Version-locked to what stylo 0.20 itself uses (types appear in its API)
euclid = "0.22"
app_units = "0.7"
html5ever = "0.39"
markup5ever = "0.39"
xml5ever = "0.39"
atomic_refcell = "0.1"

# Text shaping/layout and CPU rasterization
cosmic-text = "0.19"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
tiny-skia = "0.12"
# GPU backend. A second rasterizer over the same display list, to keep the
# paint seam honest — vello maps glyph runs onto pre-shaped glyphs directly,
# so nothing is re-shaped on the way to the GPU.
vello = "0.10"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "rayon"] }

# EPUB
rbook = "0.7"
# CBZ (deflate + stored cover the comic archives in the wild)
zip = { version = "8", default-features = false, features = ["deflate"] }
# PDF rasterization (pure Rust, CPU-only)
hayro = "0.7"
sha1 = "0.10" # IDPF font de-obfuscation key derivation

# OPDS. NOTE: not atom_syndication/feed-rs — both silently drop the
# foreign-namespace <link> attributes (opds:*, thr:count, pse:*) that facets
# and page streaming live in. See docs/OPDS-INTEROP.md §0.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Library persistence
rusqlite = { version = "0.40", features = ["bundled"] }

# Viewer
winit = "0.30"
softbuffer = "0.4"
# Clipboard for the winit shell (GTK has gdk's). Text only — the image-data
# default feature would pull a second `image` build; wayland-data-control
# covers Wayland alongside X11.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }

# Misc
libc = "0.2"
slotmap = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Dev
insta = { version = "1", features = ["glob"] }
proptest = "1"

[profile.dev]
# stylo is slow in unoptimized builds; keep debug-friendly but usable
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
