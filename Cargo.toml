[package]
name = "kalam-engine"
version = "0.1.0"
edition = "2021"
authors = ["Kalam Team"]
description = "Pure-Rust, high-performance text rendering & pagination engine for Kalam / calibre-alt."
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
cosmic-text = "0.12"
lol_html = "2.1"
tiny-skia = "0.11"
zip = "2.2"
quick-xml = "0.36"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "demo"
path = "examples/demo.rs"
