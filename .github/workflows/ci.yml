name: CI

# Kalam's check, replacing Chapbook's nine-job matrix (Windows, macOS,
# Android/e-ink ARM targets, WASM, MSRV...). kalam-engine ships to one place,
# a Linux desktop, so one job on Linux is the whole gate.
#
# Runs on the pinned toolchain from rust-toolchain.toml, exactly like
# Chapbook did, so a new Rust release cannot turn the repo red on its own.

on:
  push:
    # Work branches too, not just the trunk: the sandbox that writes most of
    # this code has no Rust toolchain, so a push is how it compiles. Every
    # push gets fmt + clippy + tests; the owner's machine is then only
    # needed for what CI cannot see (a window, speed, memory).
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run for the old one. Saves
# minutes when fixes land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What the workflow's token may do: read the code, write check runs (the
# "CI details" report below). Nothing else.
permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (Linux)
    # 26.04 rather than -latest: the GTK viewer's accessibility surface uses
    # GTK >= 4.16 API (gated `v4_16` in gtk4-rs) and 24.04 ships 4.14.
    # Inherited from Chapbook's CI; revisit when -latest reaches 26.04.
    runs-on: ubuntu-26.04
    # A hung build must not eat the month's free minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The only system library the workspace needs (gtk4-sys probes for
      # gtk4.pc through pkg-config). Everything else builds from source.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A red run still warms the cache for the fix that follows it.
          cache-on-failure: true

      # Every step runs even after an earlier one fails, so one run reports
      # every problem. Each step's output also goes into the job summary,
      # which is readable through the API — the raw log is not, from
      # everywhere, and the sandbox that pushes most commits here can only
      # reach github.com.
      - name: rustfmt
        id: fmt
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee fmt.txt
      - name: clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets 2>&1 | tee clippy.txt
      - name: tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.txt

      # The output of whatever failed, published two ways: the job summary
      # (for a browser) and a check run named "CI details" (for the API —
      # `gh api repos/OWNER/REPO/commits/SHA/check-runs` returns its text,
      # which is how the sandbox reads a failure it cannot open the log
      # of). Capped near the 65535-char limit of a check-run text.
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          noise='^\s*\(Compiling\|Checking\|Downloaded\|Downloading\|Fresh\|Running\|Doc-tests\)\|\.\.\. ok$\|^running [0-9]* tests\?$\|^$'
          {
            echo "| step | result |"
            echo "|---|---|"
            echo "| rustfmt | $FMT |"
            echo "| clippy | $CLIPPY |"
            echo "| tests | $TEST |"
            echo
            if [ "$FMT" != success ]; then
              echo "## rustfmt"; echo '```diff'; tail -c 20000 fmt.txt; echo '```'
            fi
            if [ "$CLIPPY" != success ]; then
              echo "## clippy"; echo '```'; grep -v "$noise" clippy.txt | tail -c 30000; echo '```'
            fi
            if [ "$TEST" != success ]; then
              echo "## tests"; echo '```'; grep -v "$noise" test.txt | tail -c 30000; echo '```'
            fi
          } > details.md
          cat details.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$FMT" = success ] && [ "$CLIPPY" = success ] && [ "$TEST" = success ]; then
            conclusion=success; title="fmt, clippy and tests all passed"
          else
            conclusion=failure; title="rustfmt $FMT · clippy $CLIPPY · tests $TEST"
          fi
          python3 - "$conclusion" "$title" <<'PY'
          import json, sys
          conclusion, title = sys.argv[1], sys.argv[2]
          text = open("details.md", encoding="utf-8", errors="replace").read()
          if len(text) > 64000:
              text = text[:64000] + "\n… (truncated)"
          json.dump({
              "name": "CI details",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": conclusion,
              "output": {"title": title, "summary": title, "text": text},
          }, open("check.json", "w"))
          PY
          gh api "repos/${{ github.repository }}/check-runs" --input check.json --silent \
            || echo "::warning::could not publish the CI details check run"
      - name: gate
        if: always()
        run: |
          test "${{ steps.fmt.outcome }}" = success \
            && test "${{ steps.clippy.outcome }}" = success \
            && test "${{ steps.test.outcome }}" = success
