name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The toolchain is pinned, not floating: `@stable` let a Rust release turn
  # the repo red with no commit, and 1.98 did. Keep in lockstep with
  # rust-toolchain.toml, which is what cargo actually obeys here — the action
  # only sets rustup's *default*, and a toolchain file outranks the default.
  RUST_PIN: "1.98.0"
  MSRV: "1.92"

jobs:
  check:
    name: fmt + clippy + test (pinned stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only system library the workspace needs: gtk4-sys probes for
      # gtk4.pc through pkg-config, and the runner image ships pkg-config
      # but no GTK. Everything else builds from source — sqlite is bundled,
      # fontconfig is the pure-Rust parser.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  device-targets:
    # The panel backend transcribes kernel structs whose layout shifts with
    # word size, and every e-ink device is 32- or 64-bit ARM. `check` is
    # enough: the layout assertions are const-evaluated, so a drifted
    # transcription fails here without a linker, a device, or an emulator.
    # Scoped to the crates that cross-compile without system libraries —
    # the rest of the workspace wants sqlite, fontconfig and GTK.
    name: check (armv7 + aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          targets: armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p chapbook-core -p chapbook-panel-fbdev --target armv7-unknown-linux-gnueabihf
      - run: cargo check -p chapbook-core -p chapbook-panel-fbdev --target aarch64-unknown-linux-gnu

  reader-features:
    # chapbook-reader's formats are separately compilable, and a device
    # build turns off what its hardware will never open. Nothing in the
    # workspace builds those narrow configurations — every shell here asks
    # for all three — so without this job an EPUB-only build would rot
    # silently between releases. `check` catches it, since what breaks is
    # a `cfg` that stops compiling, and `-D warnings` catches the other
    # half: code that goes dead when a format leaves.
    #
    # `opds` without `ureq` is the device shape — OPDS parsing with the
    # host's own transport and no TLS stack in the build — so it is listed
    # alongside `opds,ureq` rather than only implied by the default build.
    #
    # The empty entry is now the EPUB-only profile: no library, and so no
    # rusqlite and no bundled SQLite. It is the smallest thing chapbook
    # builds and the one a browser forces.
    name: check (chapbook-reader feature matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "library"
          - "cbz"
          - "pdf"
          - "opds"
          - "opds,ureq"
          - "cbz,pdf"
          - "cbz,opds"
          - "pdf,opds"
          - "library,cbz,pdf"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p chapbook-reader --no-default-features --features "${{ matrix.features }}"

  wasm-profile:
    # The EPUB-only profile — no library, no loader thread, no networking —
    # checked for wasm32. Not a build: no linker, no wasm-bindgen, no Node.
    #
    # What it catches is narrow, and worth saying, because a job that looks
    # like it proves more than it does is worse than no job. It does *not*
    # prove SQLite is gone: `chapbook-library` compiles for wasm32 perfectly
    # well and merely fails to work, which is why the `library` feature
    # exists and why the dependency count is the evidence there. What this
    # catches is a new ambient dependency quietly closing the door — an
    # `std::fs` call, an `Instant::now`, a thread spawned on the EPUB path.
    name: check (wasm32, EPUB-only profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p chapbook-reader --no-default-features --target wasm32-unknown-unknown

  licenses:
    # chapbook is MIT OR Apache-2.0, but the graph is not uniformly either —
    # stylo is MPL-2.0, tiny-skia is BSD-3-Clause, rbook is Apache-2.0 only.
    # NOTICE records where and why. This job exists so a dependency bump
    # cannot widen that set without somebody deciding to; the allow-list in
    # deny.toml is the decision record.
    name: licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  msrv:
    name: build (MSRV 1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      # RUSTUP_TOOLCHAIN, not just the installed default: rust-toolchain.toml
      # outranks `rustup default`, so without this the job silently rebuilt on
      # the pinned stable and proved nothing about the MSRV.
      - run: cargo build --workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
